<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>MRX.Health — Simple Medication Safety</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MRX">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    window.tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'slide-up': 'slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-right': 'slide-right 1s ease-out forwards',
            'pulse-soft': 'pulse-soft 4s ease-in-out infinite',
            'scanner': 'scanner 4s linear infinite',
            'shimmer': 'shimmer 2s infinite',
            'spin-slow': 'spin 10s linear infinite',
            'running-track': 'running-track 1.5s linear infinite',
            'color-shift': 'color-shift 8s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            'slide-up': {
              '0%': { transform: 'translateY(20px)', opacity: 0 },
              '100%': { transform: 'translateY(0px)', opacity: 1 },
            },
            'slide-right': {
              '0%': { transform: 'translateX(-20px)', opacity: 0 },
              '100%': { transform: 'translateX(0px)', opacity: 1 },
            },
            'pulse-soft': {
              '0%, 100%': { opacity: 1, transform: 'scale(1)' },
              '50%': { opacity: 0.8, transform: 'scale(0.98)' },
            },
            'scanner': {
              '0%': { transform: 'translateY(0)', opacity: 0 },
              '10%': { opacity: 1 },
              '90%': { opacity: 1 },
              '100%': { transform: 'translateY(350px)', opacity: 0 },
            },
            'shimmer': {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(100%)' },
            },
            'running-track': {
              '0%': { backgroundPosition: '0% 0%' },
              '100%': { backgroundPosition: '200% 0%' }
            },
            'color-shift': {
              '0%, 100%': { color: '#3b82f6' },
              '33%': { color: '#10b981' },
              '66%': { color: '#8b5cf6' }
            }
          },
          colors: {
            mrx: {
              canvas: '#d4dce8',
              'canvas-dark': '#0b0b0e',
              panel: '#ffffff',
              'panel-dark': '#121216',
              inset: '#eef2f8',
              'inset-dark': '#18181e',
              line: '#b8c4d4',
              'line-dark': '#2a2a32',
              sidebar: '#e4eaf2',
              'sidebar-dark': '#070709',
              overlay: '#3f3f46',
              'overlay-dark': '#030305',
              accent: '#2563eb',
            },
            clinical: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              900: '#1e3a8a',
              950: '#2e3340',
            }
          },
          boxShadow: {
            'mrx-sm': '0 1px 3px rgba(15, 23, 42, 0.07), 0 1px 2px rgba(37, 99, 235, 0.04)',
            'mrx-md': '0 6px 20px rgba(15, 23, 42, 0.09), 0 2px 8px rgba(37, 99, 235, 0.07)',
            'mrx-lg': '0 14px 36px rgba(15, 23, 42, 0.11), 0 4px 14px rgba(37, 99, 235, 0.08)',
            'mrx-xl': '0 22px 50px rgba(15, 23, 42, 0.13), 0 8px 20px rgba(37, 99, 235, 0.1)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      background-color: #d4dce8;
      color: #1f2937;
    }

    .dark body,
    html.dark body {
      background-color: #0b0b0e;
      color: #f4f4f5;
    }

    .mrx-card {
      background: #ffffff;
      border: 1px solid #b8c4d4;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.09), 0 2px 8px rgba(37, 99, 235, 0.07);
    }

    .dark .mrx-card {
      background: #121216;
      border: 1px solid #2a2a32;
      box-shadow: none;
    }

    .mrx-nav-active {
      background: #ffffff !important;
      border: 1px solid #b8c4d4;
      border-left: 3px solid #2563eb !important;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.1), 0 1px 4px rgba(37, 99, 235, 0.08);
      color: #1d4ed8 !important;
    }

    .dark .mrx-nav-active {
      background: #18181e !important;
      border: 1px solid #2a2a32;
      border-left: 3px solid #3b82f6 !important;
      box-shadow: none;
      color: #f4f4f5 !important;
    }

    .mrx-btn-primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 1rem;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.15);
    }

    .mrx-btn-primary:hover {
      background: #3b82f6;
    }

    .mrx-input {
      width: 100%;
      background: #eef2f8;
      border: 1px solid #b8c4d4;
      border-radius: 1rem;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      outline: none;
      color: #1f2937;
    }

    .dark .mrx-input {
      background: #18181e;
      border-color: #2a2a32;
      color: #f4f4f5;
    }

    .mrx-input:focus {
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.35);
    }

    .mrx-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 0.375rem;
    }

    .dark .mrx-label {
      color: #a1a1aa;
    }
    
    .glass-morphism {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
      border: 1px solid #d4d8de;
    }

    .dark .glass-morphism {
      background: rgba(18, 18, 22, 0.85);
      border: 1px solid #2a2a32;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #c5cad1;
      border-radius: 10px;
    }
    .dark ::-webkit-scrollbar-thumb { background: #3a3a44; }
    
    .animate-entrance {
      animation: slide-up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-mrx-canvas dark:bg-mrx-canvas-dark text-gray-900 dark:text-zinc-100 selection:bg-clinical-500 selection:text-white transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
